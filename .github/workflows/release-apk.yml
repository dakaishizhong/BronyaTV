name: Publish signed APK

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/release-apk.yml"
      - "releases/**"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: publish-signed-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify and publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="$(cat releases/CURRENT_VERSION)"
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          release_dir="releases/$RELEASE_TAG"
          apk="$release_dir/BronyaTV-$version-release.apk"
          if [[ ! -s "$apk" ]]; then
            apk="$release_dir/EmberTV-$version-release.apk" # Historical signed packages
          fi
          test -s "$apk"
          (
            cd "$release_dir"
            sha256sum --check SHA256SUMS
          )
          assets=("$apk" "$release_dir/SHA256SUMS")
          evidence="$release_dir/BronyaTV-$version-remote-validation.zip"
          if [[ -s "$evidence" ]]; then
            assets+=("$evidence")
          fi
          assets+=(--repo "$GITHUB_REPOSITORY")
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "BronyaTV $version" --notes-file "$release_dir/RELEASE-NOTES.md"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "BronyaTV $version" --notes-file "$release_dir/RELEASE-NOTES.md"
          fi
          # Keep the existing release's display name consistent with the renamed app.
          if [[ "$RELEASE_TAG" != "v1.0.3" ]] && gh release view v1.0.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.0.3 --repo "$GITHUB_REPOSITORY" --title "BronyaTV 1.0.3" --notes-file releases/v1.0.3/RELEASE-NOTES.md
          fi
          if [[ "$RELEASE_TAG" != "v1.1.0" ]] && gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.1.0 --repo "$GITHUB_REPOSITORY" --title "BronyaTV 1.1.0" --notes-file releases/v1.1.0/RELEASE-NOTES.md
          fi
